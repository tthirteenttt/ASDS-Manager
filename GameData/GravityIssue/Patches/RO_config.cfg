// ============================================================================
// Realism Overhaul & RealAntennas Configuration for ASOG Drone Ship
// Part: LH_SPX_ASOG (GravityIssue)
// Real-world reference: Marmac 302 Barge (91.4 m x 45 m x 6.1 m, ~1,800 t)
// Note: Provided for ASOG only (Jacklyn / Javelin is not configured for RO).
// ============================================================================

@PART[LH_SPX_ASOG]:NEEDS[RealismOverhaul,GravityIssue]:AFTER[RealismOverhaul]
{
    %RSSROConfig = True

    // Scale stock 63.3 m x 30.6 m x 4.2 m mesh by 1.45x -> 91.8 m x 44.4 m x 6.1 m (1:1 real scale)
    %rescaleFactor = 1.45

    @title = Autonomous Spaceport Drone Ship (ASOG)
    @manufacturer = SpaceX / Bollinger Shipyards
    @description = "A Shortfall of Gravitas" (Marmac 302) autonomous ocean landing platform equipped with four diesel-electric azimuth thrusters, blast walls, and maritime telemetry.

    // ~1,800 t empty displacement; buoyancy = 0.35 sits stably at 1.45^3 volume
    @mass = 1800.0
    @buoyancy = 0.35
    @crashTolerance = 150
    @breakingForce = 2000
    @breakingTorque = 2000

    // High-temperature deck tolerance for Merlin 1D landing exhaust plume
    @maxTemp = 1273.15
    %skinMaxTemp = 1673.15

    // Onboard DGPS, radar, and station-keeping avionics power draw (~2.5 kW)
    @MODULE[ModuleCommand]
    {
        @RESOURCE[ElectricCharge]
        {
            @rate = 2.5
        }
    }

    // Onboard battery bank
    @RESOURCE[ElectricCharge]
    {
        @amount = 360000
        @maxAmount = 360000
    }

    // Continuous marine diesel-electric generator (50 kW)
    @MODULE[ModuleGenerator]
    {
        @OUTPUT_RESOURCE[ElectricCharge]
        {
            @rate = 50.0
        }
    }

    // Stabilization torque to resist wave roll and touchdown impulses
    %reactionWheelConfigured = true
    @MODULE[ModuleReactionWheel]
    {
        @PitchTorque = 5000
        @YawTorque = 5000
        @RollTorque = 20000

        @RESOURCE[ElectricCharge]
        {
            @rate = 0.001
        }
    }

    // Replace stock LiquidFuel with 50,000 L marine diesel/kerosene tank (~41 t)
    !RESOURCE[LiquidFuel],* {}

    MODULE
    {
        name = ModuleFuelTanks
        type = Default
        volume = 50000.0
        basemass = -1

        TANK
        {
            name = Kerosene
            amount = 50000.0
            maxAmount = 50000.0
        }
    }

    // Four azimuth station-keeping thrusters (250 kN total)
    @MODULE[ModuleEnginesFX]
    {
        @minThrust = 0.0
        @maxThrust = 250.0
        @heatProduction = 5.0
        %ullage = False
        %pressureFed = False
        %ignitions = -1

        !PROPELLANT,* {}
        PROPELLANT
        {
            name = Kerosene
            ratio = 1.0
            DrawGauge = True
        }

        @atmosphereCurve
        {
            !key,* = DELETE
            key = 0 3500
            key = 1 3500
            key = 5 0.001
        }
    }

    !MODULE[ModuleDataTransmitter],* {}
}

// RealAntennas maritime satellite telemetry dish
@PART[LH_SPX_ASOG]:NEEDS[RealAntennas,GravityIssue]:AFTER[RealAntennas]
{
    MODULE
    {
        name = ModuleRealAntenna
        referenceGain = 12.0
        referenceFrequency = 2250
        RFBand = S
        TxPower = 43.0
        TechLevel = 8
    }
}
