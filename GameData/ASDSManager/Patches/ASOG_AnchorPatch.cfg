// ============================================================================
// ASDS Manager - ModuleManager patch injecting ModuleBargeAnchor onto barges
// ============================================================================

// 1. GravityIssue: ASOG (A Shortfall of Gravitas)
@PART[LH_SPX_ASOG]:NEEDS[GravityIssue]
{
    MODULE
    {
        name = ModuleBargeAnchor
        isAnchored = false
        deckAltitudeOffset = 0.5
        lockedHeading = 90.0
        maintainHorizon = true
    }
}

// 2. GravityIssue: Jacklyn LPV
@PART[JACKLYN_LPV]:NEEDS[GravityIssue]
{
    MODULE
    {
        name = ModuleBargeAnchor
        isAnchored = false
        deckAltitudeOffset = 0.5
        lockedHeading = 90.0
        maintainHorizon = true
    }
}

// 3. Generic fallback: any command part whose title contains "ASDS"
@PART[*]:HAS[@MODULE[ModuleCommand],#title[*ASDS*]]:FINAL
{
    MODULE
    {
        name = ModuleBargeAnchor
        isAnchored = false
        deckAltitudeOffset = 0.5
        lockedHeading = 90.0
        maintainHorizon = true
    }
}
